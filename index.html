const cv=document.getElementById('cv'),g=cv.getContext('2d'),heroEl=document.getElementById('hero'),bubble=document.getElementById('bubble'),stage=document.getElementById('stage');
const lifeEl=document.getElementById('life'),scoreEl=document.getElementById('score'),btcEl=document.getElementById('btc'),fill=document.getElementById('fill'),over=document.getElementById('over');
let run=false,last=0,cam=0,lives=3,score=0,cp=0,charging=false,p=.08,pd=1,raf=0,qt=0,liq=false;
const H={x:70,y:340,w:95,h:125,vx:0,vy:0,on:true,hit:false,state:'idle'}, GR=1180;
const POSE={
 idle:{feet:.925,scale:1.00},
 charge:{feet:.91,scale:1.02},
 jump:{feet:.86,scale:1.06},
 flight:{feet:.84,scale:1.07},
 land:{feet:.93,scale:1.02},
 hit:{feet:.82,scale:1.08},
 win:{feet:.93,scale:1.02}
};
const C=[[40,430,125,100,1],[225,390,90,135,1],[365,445,76,105,0],[495,350,105,165,1],[660,300,86,150,1],[800,405,82,125,0],[935,285,105,180,1],[1100,240,82,145,1],[1245,385,135,220,0],[1450,245,76,145,1],[1580,205,95,180,1],[1735,325,80,130,0],[1870,190,105,190,1],[2035,145,80,150,1],[2170,265,85,165,0],[2310,145,105,195,1],[2480,105,78,150,1],[2625,250,135,235,0],[2835,100,80,160,1],[2975,65,105,195,1],[3140,180,80,150,0],[3280,65,110,205,1],[3455,105,90,165,1],[3620,45,130,225,1]].map((a,i)=>({x:a[0],y:a[1],w:a[2],h:a[3],green:!!a[4],i}));
const redQ=['Patrzcie jak wybili SL, a teraz idą tam gdzie pokazywałem','To nie było normalne, manipulacja grubasów','Co to ma być kurka, to się nadaje do prokuratury'];
function setState(s){H.state=s;heroEl.src=SPR[s]||SPR.idle}
function hud(){lifeEl.textContent=lives;scoreEl.textContent=score;btcEl.textContent=Math.round(85+Math.min(1,H.x/3620)*35)+'K'}
function say(t){bubble.textContent=t;bubble.style.display='block';clearTimeout(qt);qt=setTimeout(()=>bubble.style.display='none',2300)}
function reset(){lives=3;score=0;cp=0;cam=0;liq=false;Object.assign(H,{x:70,y:305,vx:0,vy:0,on:true,hit:false});setState('idle');hud()}
function start(){document.getElementById('cover').classList.add('hidden');over.classList.add('hidden');reset();run=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function chargeStart(){if(run&&H.on){charging=true;p=.08;pd=1;setState('charge')}}
function release(){if(!charging||!run||!H.on)return;charging=false;let m=.25+.75*p;H.vx=255+355*m;H.vy=-(430+255*m);H.on=false;setState('jump');fill.style.width='0%'}
function respawn(){let c=C[cp];H.x=c.x+c.w/2-H.w/2;H.y=c.y-H.h;H.vx=H.vy=0;H.on=true;H.hit=false;setState('idle');cam=Math.max(0,H.x-220)}
function hurt(){if(H.hit)return;H.hit=true;lives--;hud();setState('hit');say(redQ[Math.floor(Math.random()*redQ.length)]);try{navigator.vibrate?.([80,40,120])}catch(e){};if(lives<=0)setTimeout(gameOver,650);else setTimeout(respawn,650)}
function land(c){H.y=c.y-H.h;H.vx=H.vy=0;H.on=true;setState('land');setTimeout(()=>{if(run&&H.on)setState('idle')},220);if(c.green){cp=c.i;H.hit=false;let d=Math.abs(H.x+H.w/2-(c.x+c.w/2));if(d<c.w*.2){score+=200;say('MAM MAPĘ RYNKU, WIDZĘ WIĘCEJ NIŻ INNI! 👑 PERFECT +200')}else score+=100;if(c.i===10)say('POSZLI BEZ NAS ALE MAM HAVE TIME! 😎')}else hurt();hud()}
function gameOver(){run=false;setState('hit');over.classList.remove('hidden');over.innerHTML='<div style="font-size:52px">📉💥</div><div style="font-size:34px;font-weight:1000;color:#ff4b4b">GAME OVER</div><b style="margin-top:14px">MAM DOŚĆ FUTURES...<br>SPOT TO PRAWDZIWY RYNEK.</b><div style="margin-top:8px">Have Time... 😎</div><button id="again" class="start">🎮 JESZCZE RAZ</button>';document.getElementById('again').onclick=start}
function win(){run=false;setState('win');score+=1000;hud();over.classList.remove('hidden');over.innerHTML='<div style="font-size:58px">🐂🚀</div><div style="font-size:42px;font-weight:1000;color:#ffd34e">HOSSA!</div><b>DO HOSSY ZAWSZE DO PRZODU!</b><div style="font-size:28px;font-weight:900;margin-top:12px">🏆 '+score+' pkt</div><button id="again" class="start">ZAGRAJ PONOWNIE</button>';document.getElementById('again').onclick=start}
function update(dt){if(charging){p+=pd*dt*1.08;if(p>=1){p=1;pd=-1}else if(p<=.08){p=.08;pd=1}fill.style.width=p*100+'%'}if(!H.on){let old=H.y+H.h;H.vy+=GR*dt;H.x+=H.vx*dt;H.y+=H.vy*dt;setState(H.vy<40?'flight':'jump');let now=H.y+H.h;if(H.vy>0)for(let c of C)if(H.x+H.w>c.x-16&&H.x<c.x+c.w+16&&old<=c.y+6&&now>=c.y){land(c);break}}cam=Math.max(cam,H.x-230);cam=Math.min(cam,2940);if(H.y>590){hurt();H.y=170;H.vx=H.vy=0}if(H.x>1240&&!liq){liq=true;say('⚠ LIKWIDACJA! CO TO MA BYĆ KURKA?!')}if(H.x>3580)win();hud()}
function bg(){let z=g.createLinearGradient(0,0,0,562);z.addColorStop(0,'#239ee5');z.addColorStop(.65,'#bcecff');z.addColorStop(1,'#ffe1a0');g.fillStyle=z;g.fillRect(0,0,900,562);g.fillStyle='#fff';for(let i=0;i<5;i++){let x=(i*240-(cam*.08)%1200);g.beginPath();g.arc(x+80,100+(i%2)*50,28,0,7);g.arc(x+112,90+(i%2)*50,38,0,7);g.arc(x+148,102+(i%2)*50,27,0,7);g.fill()}g.fillStyle='#72b957';for(let i=-1;i<7;i++){let x=i*180-(cam*.18)%180;g.beginPath();g.arc(x+90,540,140,Math.PI,0);g.fill()}g.fillStyle='#4a974c';for(let i=-1;i<8;i++){let x=i*145-(cam*.28)%145;g.beginPath();g.arc(x+65,562,105,Math.PI,0);g.fill()}}
function candle(c){let x=c.x-cam;if(x<-160||x>980)return;let col=c.green?'#16d563':'#ef3e45';g.strokeStyle=col;g.lineWidth=6;g.beginPath();g.moveTo(x+c.w/2,c.y-38);g.lineTo(x+c.w/2,Math.min(555,c.y+c.h+38));g.stroke();g.fillStyle=col;g.shadowColor=col;g.shadowBlur=10;g.fillRect(x,c.y,c.w,Math.min(c.h,550-c.y));g.shadowBlur=0;g.fillStyle='#ffffff35';g.fillRect(x+8,c.y+8,Math.max(6,c.w*.12),Math.min(55,c.h-16))}
function draw(){bg();C.forEach(candle);if(cam>1050&&cam<1700){g.fillStyle='#161616';g.fillRect(490,75,320,62);g.strokeStyle='#ff3434';g.lineWidth=5;g.strokeRect(490,75,320,62);g.fillStyle='#ff3434';g.font='900 27px Arial';g.fillText('⚠ LIKWIDACJA',535,115)}if(cam>2760){g.fillStyle='#7b500b';g.font='900 34px Arial';g.fillText('ATH  →  🐂 HOSSA 🚀',500,85)}let sx=(H.x-cam)/900*stage.clientWidth;
let footY=(H.y+H.h)/562*stage.clientHeight;
let pose=POSE[H.state]||POSE.idle;
let drawW=Math.max(92,stage.clientWidth*.14)*pose.scale;
heroEl.style.width=drawW+'px';
/* Natural image ratio is known after the embedded sprite loads.
   Anchor the calibrated feet line to the physics platform top. */
let ratio=(heroEl.naturalWidth&&heroEl.naturalHeight)?heroEl.naturalHeight/heroEl.naturalWidth:1.45;
let drawH=drawW*ratio;
heroEl.style.left=(sx-(drawW-H.w/900*stage.clientWidth)*.22)+'px';
heroEl.style.top=(footY-drawH*pose.feet)+'px';
if(bubble.style.display==='block'){
 bubble.style.left=Math.max(8,Math.min(stage.clientWidth*.52,sx+55))+'px';
 bubble.style.top=Math.max(8,footY-drawH*pose.feet-48)+'px'
}}
function loop(t){if(!run)return;let dt=Math.min(.025,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
document.getElementById('start').onclick=start;const jb=document.getElementById('jump');
jb.addEventListener('contextmenu',e=>e.preventDefault());jb.addEventListener('pointerdown',e=>{e.preventDefault();chargeStart()});jb.addEventListener('pointerup',e=>{e.preventDefault();release()});jb.addEventListener('pointercancel',release);stage.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat)chargeStart()});stage.addEventListener('keyup',e=>{if(e.code==='Space')release()});
setState('idle');bg();C.forEach(candle);draw();
</script></div></body></html>
